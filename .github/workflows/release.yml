name: Release

# A tag push creates the GitHub release and publishes to the registry the repository variable PUBLISH_REGISTRY
# names (npm when unset). A maintainer can publish an existing tag by hand to either registry, which is what
# .dev/tools/npm-release does:  gh workflow run release.yml -f tag=vX.Y.Z -f registry=github
# GitHub Packages (npm.pkg.github.com) needs no npm account: the run's own GITHUB_TOKEN publishes.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing release tag to publish, e.g. v0.6.0'
        required: true
      registry:
        description: 'npm (registry.npmjs.org) or github (GitHub Packages)'
        type: choice
        options: [npm, github]
        default: npm

permissions:
  contents: write
  id-token: write # OIDC for npm trusted publishing + provenance
  packages: write # GitHub Packages, with the run's GITHUB_TOKEN

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TARGET: ${{ inputs.registry || vars.PUBLISH_REGISTRY || 'npm' }}
    steps:
      - name: Check the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z)." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # current LTS; Node 20 is end-of-life
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package.json

      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Extract changelog for this tag
        id: changelog
        run: |
          VERSION="${TAG#v}"
          # Print the body of this version's "## [X.Y.Z]" section, skipping the
          # leading blank line(s) so the release body starts at the first content.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture {
              if (!started && $0 ~ /^[[:space:]]*$/) next
              started = 1
              print
            }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release $VERSION" > release-notes.md
          fi
          echo "--- release body preview ---"
          cat release-notes.md

      # Only for a tag push: publishing an existing tag by hand leaves its release alone.
      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          generate_release_notes: true

      # GitHub Packages is reached through its own userconfig, so the .npmrc
      # setup-node wrote for npm is untouched.
      - name: Point GitHub Packages at the run's token
        if: env.TARGET == 'github'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '@simtabi:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$GITHUB_TOKEN" > "$RUNNER_TEMP/github-packages.npmrc"

      # A version the registry already has is reported, not failed, so a re-run is safe.
      - name: Check whether this version is already published
        id: published
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$TARGET" = github ]; then
            found=$(npm view "$name@$version" version --userconfig "$RUNNER_TEMP/github-packages.npmrc" 2>/dev/null || true)
            label="GitHub Packages"
          else
            found=$(npm view "$name@$version" version 2>/dev/null || true)
            label=npm
          fi
          if [ "$found" = "$version" ]; then
            echo "already on $label: $name@$version"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.published.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          if [ "$TARGET" = github ]; then
            npm publish --userconfig "$RUNNER_TEMP/github-packages.npmrc" --registry https://npm.pkg.github.com --provenance=false
          else
            npm publish --provenance --access public
          fi
