<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tabar — Bootstrap 5</title>
  <!-- Bootstrap with Subresource Integrity (recommended for any CDN asset). -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
</head>
<body class="container py-5" style="max-width: 720px">
  <h1 class="h3 mb-2">Alongside Bootstrap 5</h1>
  <p class="text-secondary mb-4">Tabar coexists with Bootstrap's own <code>.progress</code>
    component — different class namespace, zero conflicts. Theme it with CSS variables.</p>

  <div id="host" class="my-4" style="--tabar-color: var(--bs-danger); --tabar-height: 8px;"></div>

  <div class="d-flex gap-2">
    <button id="go" class="btn btn-danger">Animate</button>
    <button id="indet" class="btn btn-outline-secondary">Indeterminate</button>
    <button id="done" class="btn btn-outline-secondary">Done</button>
  </div>

  <script type="module">
    import { Tabar } from '../src/tabar.js';

    const bar = new Tabar({ position: 'inline', mountTo: '#host', radius: 4, innerRadius: 4 });
    bar.show();

    document.getElementById('go').addEventListener('click', () => bar.set(0.7));
    document.getElementById('indet').addEventListener('click', () => bar.indeterminate(true));
    document.getElementById('done').addEventListener('click', () => bar.done());
  </script>
</body>
</html>
